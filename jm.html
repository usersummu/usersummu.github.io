<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no">
    <title>【禁漫最新版v2.1.9】☞ 点此安装</title>

    <script type="text/javascript">
        (function() {
            var p = navigator.platform;
            var isWin = p.indexOf("Win") == 0;
            var isMac = p.indexOf("Mac") == 0;
            var isLinux = (p == "X11") || (p.indexOf("Linux") == 0);
            
            // 判断如果是电脑端 (Windows / Mac / Linux)
            if (isWin || isMac || isLinux) {
                // 如果屏幕宽度大于768，更加确定是电脑设备
                if (window.screen.width > 768 || window.screen.width == 0) {
                    window.location.replace("https://ds.163.com/");
                }
            }
        })();
    </script>

    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #e5e5e5;
            border-top: 4px solid #ff4757;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            animation: spin 1.1s linear infinite;
        }
        .tip {
            margin-top: 18px;
            font-size: 15px;
            color: #333;
            font-weight: 600;
        }
        .sub-tip {
            margin-top: 8px;
            font-size: 13px;
            color: #888;
        }
        .corner-gif { 
            position: fixed; 
            right: 10px; 
            bottom: 10px; 
            width: 30vw; 
            max-width: 150px;
            height: auto; 
            z-index: 999; 
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>

<body>

    <img src="jmmm.png" style="width:1px;height:1px;display:none;">

    <div class="loader"></div>
    <div class="tip" id="mainTip">由于服务器在国外加载较慢，请稍候片刻，或多刷新几次。</div>
    <div class="sub-tip" id="subTip">系统将自动为您匹配最快节点</div>
    <img src="logo.webp" alt="logo" class="corner-gif">

    <script>
        if (typeof LA !== 'undefined') {
            LA.init({id: "Kj74jTozAJctuQ0u", ck: "Kj74jTozAJctuQ0u"});
        }
    </script>

    <script>
    (function(){
        // 配置区：你的目标宣传网址
        var PRIMARY_URL   = "https://edge.zz2q8x7r9d2k5f6a.com/";   
        var SECONDARY_URL = "https://edge.zz2q8x7r9d2k5f6a.com/";     
        
        var timeoutTime = 2200; 
        var isRedirected = false;

        function jump(url) {
            if(isRedirected) return;
            isRedirected = true;
            window.location.replace(url + "?ref=jump&t=" + Date.now());
        }

        // 1. 保底定时器（主站卡顿去副站）
        var timer = setTimeout(function(){
            var mainTip = document.getElementById("mainTip");
            var subTip = document.getElementById("subTip");
            if(mainTip) mainTip.innerText = "主线路拥堵，正在切换备用线路...";
            if(subTip) subTip.innerText  = "即将进入，请勿关闭页面";
            
            setTimeout(function(){
                jump(SECONDARY_URL);
            }, 500);
        }, timeoutTime);

        // 2. 图片 Ping 探测主站
        var img = new Image();
        img.onload = function(){
            clearTimeout(timer);
            jump(PRIMARY_URL);
        };
        img.onerror = function(){
            clearTimeout(timer);
            jump(SECONDARY_URL);
        };
        img.src = PRIMARY_URL + "ping.png?t=" + Date.now();
    })();
    </script>

</body>
</html>
